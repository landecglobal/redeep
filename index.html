<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03060a" />
    <title>Redeep</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
      @font-face {
        font-family: Syne;
        src: url("./assets/syne-800.woff") format("woff");
        font-weight: 800;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #03060a;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #map {
        position: fixed;
        inset: 0;
      }

      .bar {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }

      .brand {
        pointer-events: auto;
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.04em;
        text-decoration: none;
        color: transparent;
        background: linear-gradient(100deg, #8ef6e8 0%, #e8fffb 45%, #7fd0ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        padding: 4px 10px;
        border-radius: 10px;
        background-color: rgba(3, 6, 10, 0.72);
        backdrop-filter: blur(6px);
      }

      .styles {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: rgba(3, 6, 10, 0.72);
        backdrop-filter: blur(6px);
      }

      .powered {
        pointer-events: auto;
        margin-left: auto;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-decoration: none;
        color: #cfe9e5;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(3, 6, 10, 0.72);
        backdrop-filter: blur(6px);
      }

      .powered strong {
        color: #8ef6e8;
        font-weight: 600;
      }

      .powered .star {
        color: #8ef6e8;
        margin-left: 2px;
      }

      .styles button {
        font: inherit;
        font-size: 13px;
        color: #cfe9e5;
        background: transparent;
        border: 0;
        border-radius: 7px;
        padding: 6px 10px;
        cursor: pointer;
      }

      .styles button:hover {
        background: rgba(142, 246, 232, 0.12);
      }

      .styles button[aria-pressed="true"] {
        color: #03060a;
        background: #8ef6e8;
      }

      .styles button:focus-visible {
        outline: 2px solid #8ef6e8;
        outline-offset: 1px;
      }

      .notice {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        z-index: 2;
        max-width: calc(100% - 32px);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        color: #f2fffc;
        background: rgba(120, 20, 20, 0.88);
      }

      .notice[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map" role="region" aria-label="Mappa"></div>
    <div class="bar">
      <a class="brand" href="./landing.html" title="Redeep">Redeep</a>
      <div class="styles" role="group" aria-label="Stile mappa" id="styles"></div>
      <a class="powered" href="https://landec.io" target="_blank" rel="noopener"
         aria-label="Powered by Landec">Powered by <strong>Landec</strong> <span class="star" aria-hidden="true">★</span></a>
    </div>
    <p class="notice" id="notice" role="status" hidden></p>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script>
      (function () {
        // Basemap assets on DigitalOcean Spaces (CDN): planet.pmtiles, fonts/, sprites/, natural_earth/
        var TILES_BASE = "https://redeep-tiles.ams3.cdn.digitaloceanspaces.com";
        var ATTRIBUTION =
          '<a href="https://openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> ' +
          '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>';
        var STYLES = [
          { id: "dark", label: "Dark" },
          { id: "positron", label: "Positron" },
          { id: "liberty", label: "Liberty" },
          { id: "bright", label: "Bright" },
          { id: "fiord", label: "Fiord" },
        ];

        var notice = document.getElementById("notice");
        function showNotice(message) {
          notice.textContent = message;
          notice.hidden = false;
        }

        if (!window.maplibregl || !window.pmtiles) {
          showNotice("Impossibile caricare la mappa. Ricarica la pagina.");
          return;
        }

        var protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        var styleCache = {};
        function loadStyle(id) {
          if (styleCache[id]) return Promise.resolve(styleCache[id]);
          return fetch("./styles/" + id + ".json")
            .then(function (response) {
              if (!response.ok) throw new Error("Stile non trovato: " + id);
              return response.json();
            })
            .then(function (style) {
              // OpenFreeMap styles ship with __TILEJSON_DOMAIN__ placeholders: point them at our bucket.
              style.sources.openmaptiles = {
                type: "vector",
                url: "pmtiles://" + TILES_BASE + "/planet.pmtiles",
                attribution: ATTRIBUTION,
              };
              if (style.sources.ne2_shaded) {
                style.sources.ne2_shaded.tiles = [TILES_BASE + "/natural_earth/ne2sr/{z}/{x}/{y}.png"];
              }
              style.sprite = TILES_BASE + "/sprites/ofm_f384/ofm";
              style.glyphs = TILES_BASE + "/fonts/{fontstack}/{range}.pbf";
              styleCache[id] = style;
              return style;
            });
        }

        function storedStyle() {
          try {
            var id = localStorage.getItem("redeep-map-style");
            return STYLES.some(function (s) { return s.id === id; }) ? id : null;
          } catch (e) {
            return null;
          }
        }

        var current = storedStyle() || "dark";
        var map;
        var failed = false;

        var group = document.getElementById("styles");
        STYLES.forEach(function (s) {
          var button = document.createElement("button");
          button.type = "button";
          button.textContent = s.label;
          button.dataset.id = s.id;
          button.setAttribute("aria-pressed", String(s.id === current));
          button.addEventListener("click", function () { selectStyle(s.id); });
          group.appendChild(button);
        });

        function selectStyle(id) {
          if (id === current && map) return;
          current = id;
          try {
            localStorage.setItem("redeep-map-style", id);
          } catch (e) {}
          Array.prototype.forEach.call(group.children, function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.id === id));
          });
          loadStyle(id)
            .then(function (style) { map.setStyle(style); })
            .catch(function (error) { showNotice(error.message); });
        }

        loadStyle(current)
          .then(function (style) {
            map = new maplibregl.Map({
              container: "map",
              style: style,
              center: [12.5, 42.5],
              zoom: 4.5,
              maxZoom: 19,
              attributionControl: { compact: true },
            });
            map.addControl(new maplibregl.NavigationControl(), "bottom-right");
            map.addControl(new maplibregl.ScaleControl(), "bottom-left");
            map.on("error", function (event) {
              if (failed) return;
              var message = (event && event.error && event.error.message) || "";
              if (/pmtiles|planet|Failed to fetch|NetworkError|40[34]/i.test(message)) {
                failed = true;
                showNotice("Tile della mappa non raggiungibili al momento.");
              }
            });
          })
          .catch(function (error) {
            showNotice(error.message || "Impossibile avviare la mappa.");
          });
      })();
    </script>
  </body>
</html>
