<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Redeep</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
      :root {
        --bg: #ffffff;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --hover: #f3f4f6;
        --accent: #2563eb;
        --accent-soft: #eff6ff;
        --danger: #b91c1c;
        --rail: 44px;
        --panel-w: 310px;
        --status-h: 26px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-size: 14px; }
      button { font: inherit; color: inherit; }
      svg[hidden], [hidden] { display: none !important; }

      .app { position: fixed; inset: 0 0 var(--status-h) 0; display: flex; }

      /* Left icon rail */
      .rail {
        flex: 0 0 var(--rail);
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding-top: 8px;
        z-index: 4;
      }
      .rail button {
        width: 34px; border: 0; background: transparent; border-radius: 8px; padding: 8px 0; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted);
      }
      .rail button[aria-pressed="true"] { background: var(--hover); color: var(--text); }
      .rail button:hover { color: var(--text); }
      .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

      /* Side panels (Browser / Layer) */
      .panel {
        flex: 0 0 var(--panel-w); width: var(--panel-w);
        border-right: 1px solid var(--line); background: var(--panel);
        display: flex; flex-direction: column; z-index: 3; position: relative;
      }
      .panel-head { display: flex; align-items: center; gap: 2px; padding: 9px 8px 9px 14px; border-bottom: 1px solid var(--line); }
      .panel-head h2 { margin: 0 6px 0 0; font-size: 15px; font-weight: 600; flex: 1; }
      .panel-body { flex: 1; overflow: auto; padding: 10px; }
      .panel-foot { border-top: 1px solid var(--line); padding: 10px; }
      .hint { color: var(--muted); font-size: 13px; margin: 2px 4px 10px; line-height: 1.45; }

      .icon-btn {
        border: 0; background: transparent; border-radius: 6px; width: 28px; height: 28px;
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); flex: 0 0 auto;
      }
      .icon-btn:hover { background: var(--hover); }
      .icon-btn:disabled { opacity: 0.35; cursor: default; background: none; }
      .icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
      .icon-btn.danger:hover { background: #fee2e2; color: var(--danger); }
      .icon-btn:focus-visible, .rail button:focus-visible, .tree button:focus-visible, .basemap-grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .field { position: relative; }
      .field input {
        width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 8px 32px; font: inherit; font-size: 13px; background: #fff;
      }
      .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      .field svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
      .field-msg { font-size: 12px; color: var(--muted); margin: 6px 2px 0; min-height: 1em; }

      /* Browser tree */
      .tree { margin: 8px 0 0; padding: 0; }
      .tree details { margin: 0 0 2px; }
      .tree summary {
        list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 4px; border-radius: 6px; font-weight: 600;
      }
      .tree summary::-webkit-details-marker { display: none; }
      .tree summary:hover { background: var(--hover); }
      .tree summary .chev { display: inline-flex; transition: transform 0.15s; color: var(--muted); }
      .tree details[open] > summary .chev { transform: rotate(90deg); }
      .tree summary .count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
      .tree .items { list-style: none; margin: 0; padding: 0 0 4px 22px; }
      .tree .items li { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px; min-height: 34px; }
      .tree .items li:hover { background: var(--hover); }
      .tree .items .label { flex: 1; min-width: 0; }
      .tree .items .label b { display: block; font-weight: 500; }
      .tree .items .label small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tree .items .empty { color: var(--muted); font-size: 12.5px; padding: 2px 4px 6px; min-height: 0; }
      .tree .items li.off { opacity: 0.5; }
      .chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.15); flex: 0 0 auto; }
      .tag { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
      .tag.on { color: var(--accent); font-weight: 600; }

      /* Layer cards */
      .cards { display: flex; flex-direction: column; gap: 8px; }
      .layer-card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 8px 6px; background: #fff; }
      .layer-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .layer-row { display: flex; align-items: center; gap: 2px; }
      .layer-row .grip { color: #c0c4cc; font-size: 12px; letter-spacing: -2px; user-select: none; }
      .layer-row .name {
        flex: 1; min-width: 0; font-weight: 600; cursor: pointer; border: 0; background: none; text-align: left; padding: 2px 4px;
        display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      }
      .layer-row .kind { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 2px; white-space: nowrap; }
      .opacity { display: flex; align-items: center; gap: 8px; margin: 6px 2px 2px; font-size: 11px; color: var(--muted); }
      .opacity input { flex: 1; accent-color: var(--accent); }
      .opacity output { font-family: ui-monospace, Menlo, Consolas, monospace; min-width: 30px; text-align: right; }
      .tools { display: flex; align-items: center; margin-top: 4px; }
      .tools .icon-btn { width: 26px; height: 26px; }
      .tools .grow { flex: 1; }
      .card-info { font-size: 12px; color: var(--muted); margin: 6px 4px 2px; line-height: 1.45; }

      .menu {
        position: fixed; z-index: 40; min-width: 220px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14); padding: 4px;
      }
      .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
      .menu button:hover { background: var(--hover); }
      .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

      /* Map */
      .map-wrap { position: relative; flex: 1; min-width: 0; }
      #map {
        position: absolute; inset: 0;
        background:
          radial-gradient(1px 1px at 12% 22%, #fff9 50%, transparent 51%),
          radial-gradient(1px 1px at 68% 14%, #fff8 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 38% 74%, #fffa 50%, transparent 51%),
          radial-gradient(1px 1px at 84% 62%, #fff7 50%, transparent 51%),
          radial-gradient(1px 1px at 22% 88%, #fff8 50%, transparent 51%),
          radial-gradient(1px 1px at 56% 42%, #fff6 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 92% 30%, #fff9 50%, transparent 51%),
          radial-gradient(ellipse at center, #0b1a33 0%, #050b18 70%);
        background-size: 230px 230px, 310px 310px, 270px 270px, 190px 190px, 350px 350px, 160px 160px, 400px 400px, 100% 100%;
      }
      #map.flat { background: #f3f4f6; }
      #map.picking .maplibregl-canvas-container, #map.measuring .maplibregl-canvas-container { cursor: crosshair; }
      .ctrl-ico { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: #333; }
      .maplibregl-ctrl-group button.ctrl-active { background: var(--accent-soft); }
      .maplibregl-ctrl-group button.ctrl-active .ctrl-ico { color: var(--accent); }

      .tool-box {
        position: absolute; top: 10px; left: 10px; z-index: 5; background: #fff; border-radius: 8px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
        padding: 8px 10px; font-size: 13px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 80px);
      }
      .tool-box strong { font-weight: 600; }
      .tool-box .small-btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12.5px; }
      .tool-box .small-btn:hover { background: var(--hover); }

      .maplibregl-popup-content { padding: 10px 12px; font-size: 12.5px; max-width: 300px; }
      .feat { margin: 0 0 8px; }
      .feat:last-child { margin-bottom: 0; }
      .feat h4 { margin: 0 0 3px; font-size: 13px; }
      .feat .grp { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
      .feat table { border-collapse: collapse; margin-top: 3px; }
      .feat td { padding: 1px 8px 1px 0; vertical-align: top; }
      .feat td:first-child { color: var(--muted); }

      /* Status bar */
      .status {
        position: fixed; left: 0; right: 0; bottom: 0; height: var(--status-h); border-top: 1px solid var(--line); background: var(--panel);
        display: flex; align-items: center; gap: 22px; padding: 0 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11.5px; color: #374151; white-space: nowrap; overflow: hidden;
      }

      /* Basemap dialog */
      dialog.basemaps { border: 0; border-radius: 12px; padding: 22px 24px 24px; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
      dialog.basemaps::backdrop { background: rgba(0, 0, 0, 0.45); }
      dialog.basemaps h3 { margin: 0 0 4px; font-size: 18px; }
      dialog.basemaps p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
      dialog.basemaps .close { position: absolute; top: 14px; right: 14px; }
      .basemap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .basemap-grid button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 0 10px; cursor: pointer; overflow: hidden; font-weight: 600; text-align: center; }
      .basemap-grid button:hover { border-color: #9ca3af; }
      .basemap-grid button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
      .basemap-grid .sw { display: block; height: 54px; margin-bottom: 8px; }
      .basemap-grid small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 2px; padding: 0 6px; }

      .notice {
        position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px);
        padding: 10px 14px; border-radius: 10px; font-size: 14px; color: #fff; background: rgba(17, 24, 39, 0.92);
      }

      @media (max-width: 720px) {
        :root { --panel-w: min(310px, calc(100vw - var(--rail) - 16px)); }
        .panel { position: absolute; left: var(--rail); top: 0; bottom: 0; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.15); }
        .status .wide { display: none; }
        .basemap-grid { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>

      <defs>
        <symbol id="i-layers" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></g></symbol>
        <symbol id="i-browser" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></g></symbol>

    </svg>

    <div class="app">
      <nav class="rail" aria-label="Pannelli">
        <button type="button" id="rail-browser" aria-pressed="false" aria-controls="browser" title="Browser">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-browser"/></svg>
          <span class="vlabel">Browser</span>
        </button>
        <button type="button" id="rail-layers" aria-pressed="true" aria-controls="layers" title="Layer">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-layers"/></svg>
          <span class="vlabel">Layer</span>
        </button>
      </nav>

      <!-- Browser: what can be put on the map -->
      <aside class="panel" id="browser" aria-label="Browser" hidden>
        <div class="panel-head">
          <h2>Browser</h2>
          <button type="button" class="icon-btn" data-close-panel title="Chiudi pannello" aria-label="Chiudi pannello"><svg width="17" height="17"><use href="#i-collapse"/></svg></button>
        </div>
        <div class="panel-body">
          <div class="field">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" id="browser-q" placeholder="Cerca sorgenti dati" aria-label="Cerca sorgenti dati" autocomplete="off" />
          </div>
          <div class="tree" id="tree"></div>
        </div>
      </aside>

      <!-- Layer: what is on the map -->
      <aside class="panel" id="layers" aria-label="Layer">
        <div class="panel-head">
          <h2>Layer</h2>
          <button type="button" class="icon-btn" id="h-add" title="Aggiungi dal Browser" aria-label="Aggiungi dal Browser"><svg width="17" height="17"><use href="#i-plus"/></svg></button>
          <button type="button" class="icon-btn" id="h-basemap" title="Cambia sfondo" aria-label="Cambia sfondo"><svg width="17" height="17"><use href="#i-map"/></svg></button>
          <button type="button" class="icon-btn" id="h-eye" title="Mostra / nascondi tutti" aria-label="Mostra o nascondi tutti i layer"><svg width="17" height="17"><use href="#i-eye"/></svg></button>
          <button type="button" class="icon-btn" id="h-pick" aria-pressed="false" title="Informazioni: clicca un oggetto sulla mappa" aria-label="Strumento informazioni"><svg width="17" height="17"><use href="#i-pick"/></svg></button>
          <button type="button" class="icon-btn" data-close-panel title="Chiudi pannello" aria-label="Chiudi pannello"><svg width="17" height="17"><use href="#i-collapse"/></svg></button>
        </div>
        <div class="panel-body">
          <div class="cards" id="cards"></div>
        </div>
        <div class="panel-foot">
          <form class="field" id="goto" autocomplete="off">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" id="goto-input" placeholder="Cerca layer o coordinate (45.07, 7.68)" aria-label="Cerca layer o vai a coordinate" />
          </form>
          <p class="field-msg" id="goto-msg" role="status"></p>
        </div>
      </aside>

      <div class="map-wrap">
        <div id="map" role="region" aria-label="Mappa"></div>
        <div class="tool-box" id="measure-box" hidden>
          <strong>Misura</strong>
          <span id="measure-out">Clicca sulla mappa per aggiungere punti, doppio clic per chiudere l'area.</span>
          <button type="button" class="small-btn" id="measure-undo">Annulla punto</button>
          <button type="button" class="small-btn" id="measure-clear">Cancella</button>
          <button type="button" class="small-btn" id="measure-close">Chiudi</button>
        </div>
      </div>
    </div>

    <div class="status" aria-live="off">
      <span>Coords: <span id="st-coords">—</span></span>
      <span>Zoom: <span id="st-zoom">—</span></span>
      <span class="wide">Bearing: <span id="st-bearing">0.0°</span></span>
      <span class="wide">Pitch: <span id="st-pitch">0.0°</span></span>
      <span class="wide">BBox: <span id="st-bbox">—</span></span>
    </div>

    <dialog class="basemaps" id="basemaps" aria-labelledby="basemaps-title">
      <button type="button" class="icon-btn close" id="basemaps-close" aria-label="Chiudi">✕</button>
      <h3 id="basemaps-title">Cambia sfondo</h3>
      <p>Mappe di base Redeep: OpenStreetMap servito dai nostri server, in cinque stili.</p>
      <div class="basemap-grid" id="basemap-grid"></div>
    </dialog>

    <div class="menu" id="menu" role="menu" hidden></div>
    <input type="color" id="color-input" hidden />
    <p class="notice" id="notice" role="status" hidden></p>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script>
      (function () {
        "use strict";
        // Basemap assets on DigitalOcean Spaces (CDN): planet.pmtiles, fonts/, sprites/, natural_earth/

          return el("li", { class: inStyle ? "" : "off", title: g.note }, [
            chip(g.color),
            el("span", { class: "label" }, [el("b", { text: g.label }), el("small", { text: inStyle ? g.note : "Non presente nello stile " + styleDef(styleId).label })]),
            added ? el("span", { class: "tag on", text: "nei layer" }) : inStyle ? iconBtn("plus", "Aggiungi «" + g.label + "» ai layer", function () { addComp(g.id); }) : null,
          ]);
        }
        function renderTree() {
          var q = $("browser-q").value.trim().toLowerCase();
          var match = function (t) { return !q || t.toLowerCase().indexOf(q) >= 0; };
          treeEl.textContent = "";
          var bm = STYLES.filter(function (s) { return match(s.label + " " + s.note); });
          var cg = GROUPS.filter(function (g) { return match(g.label + " " + g.note); });
          var rc = recent.filter(function (r) {
            var d = r.kind === "style" ? styleDef(r.id) : groupDef(r.id);
            return d && match(d.label);
          });
          treeEl.appendChild(section("basemaps", "Mappe di base", bm.length, bm.map(basemapItem)));
          treeEl.appendChild(section("comps", "Componenti della mappa", cg.length, cg.map(compItem)));
          treeEl.appendChild(section("recent", "Recenti", null, rc.map(function (r) { return r.kind === "style" ? basemapItem(styleDef(r.id)) : compItem(groupDef(r.id)); })));
        }
        $("browser-q").addEventListener("input", renderTree);

        // ------------------------------------------------------------------ basemap dialog
        var dialog = $("basemaps");
        var grid = $("basemap-grid");
        STYLES.forEach(function (s) {
          grid.appendChild(el("button", { type: "button", "data-id": s.id, onclick: function () { selectStyle(s.id); dialog.close(); } }, [
            el("span", { class: "sw", style: "background:" + s.sw }), s.label, el("small", { text: s.note }),
          ]));
        });
        function openBasemaps() {
          Array.prototype.forEach.call(grid.children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === styleId)); });
          if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
          var sel = grid.querySelector('[aria-pressed="true"]');
          if (sel) sel.focus();
        }
        $("basemaps-close").addEventListener("click", function () { dialog.close(); });
        dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });

        function selectStyle(id) {
          if (id === styleId && map) return;
          styleId = id;
          save("rd.style", id);
          pushRecent({ kind: "style", id: id });
          loadStyle(id)
            .then(function (style) {
              styleJson = JSON.parse(JSON.stringify(style));
              map.setStyle(withProjection(style));
              renderLayers();
              renderTree();
            })
            .catch(function (error) { showNotice(error.message); });
        }

        // ------------------------------------------------------------------ globe
        var globeBtn = null;
        function setGlobe(on, apply) {
          globe = on;
          save("rd.globe", on);
          $("map").classList.toggle("flat", !on);
          if (globeBtn) { globeBtn.classList.toggle("ctrl-active", on); globeBtn.title = on ? "Vista piana" : "Vista globo"; }
          if (map && apply !== false) map.setProjection({ type: on ? "globe" : "mercator" });
        }
        $("map").classList.toggle("flat", !globe);

        function buttonControl(iconName, title, onclick, keep) {
          return {
            onAdd: function () {
              var box = el("div", { class: "maplibregl-ctrl maplibregl-ctrl-group" });
              var b = el("button", { type: "button", title: title, "aria-label": title, onclick: onclick }, [el("span", { class: "ctrl-ico" }, [icon(iconName, 18)])]);
              if (keep) keep(b);
              box.appendChild(b);
              return box;
            },
            onRemove: function () {},
          };
        }

        // ------------------------------------------------------------------ identify tool
        var picking = false;
        var pickBtn = null;
        var popup = null;
        function setPick(on) {
          picking = on;
          if (on) stopMeasure();
          $("map").classList.toggle("picking", on);
          $("h-pick").setAttribute("aria-pressed", String(on));
          if (pickBtn) pickBtn.classList.toggle("ctrl-active", on);
          if (on) showNotice("Clicca un oggetto sulla mappa per vederne le informazioni. Esc per uscire.");
          if (!on && popup) { popup.remove(); popup = null; }
        }
        function stopPick() { if (picking) setPick(false); }
        $("h-pick").addEventListener("click", function () { setPick(!picking); });
        var LABELS = {
          class: "Classe", subclass: "Sottoclasse", admin_level: "Livello amm.", brunnel: "Ponte/galleria", ref: "Sigla", network: "Rete",
          render_height: "Altezza (m)", ele: "Quota (m)", rank: "Rango", housenumber: "Civico", intermittent: "Intermittente", maritime: "Marittimo", disputed: "Conteso",
        };
        function identify(e) {
          var feats = map.queryRenderedFeatures(e.point).filter(function (f) { return f.layer && f.sourceLayer; });
          var seen = {};
          var list = [];
          feats.forEach(function (f) {
            var key = f.sourceLayer + ":" + (f.id != null ? f.id : JSON.stringify(f.properties));
            if (seen[key] || list.length >= 5) return;
            seen[key] = 1;
            list.push(f);
          });
          var box = el("div");
          if (!list.length) box.appendChild(el("p", { style: "margin:0", text: "Nessun oggetto qui." }));
          list.forEach(function (f) {
            var p = f.properties || {};
            var g = groupDef(groupOf({ "source-layer": f.sourceLayer, source: f.source })) || { label: f.sourceLayer };
            var name = p["name:it"] || p.name || p["name:latin"] || p.housenumber || (p.class ? String(p.class) : "Oggetto");
            var rows = el("table");
            Object.keys(p).filter(function (k) { return LABELS[k] && p[k] !== "" && p[k] != null; }).slice(0, 8).forEach(function (k) {
              rows.appendChild(el("tr", {}, [el("td", { text: LABELS[k] }), el("td", { text: String(p[k]) })]));
            });
            if (p.name && p["name:it"] && p.name !== p["name:it"]) rows.appendChild(el("tr", {}, [el("td", { text: "Nome locale" }), el("td", { text: p.name })]));
            box.appendChild(el("div", { class: "feat" }, [el("span", { class: "grp", text: g.label }), el("h4", { text: name }), rows.children.length ? rows : null]));
          });
          if (popup) popup.remove();
          popup = new maplibregl.Popup({ maxWidth: "320px" }).setLngLat(e.lngLat).setDOMContent(box).addTo(map);
        }

        // ------------------------------------------------------------------ measure tool
        var measuring = false;
        var measureBtn = null;
        var pts = [];
        var finished = false;
        function haversine(a, b) {
          var R = 6371008.8, r = Math.PI / 180;
          var dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
          var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
          return 2 * R * Math.asin(Math.sqrt(h));
        }
        function ringArea(ring) {
          // Spherical approximation (as in turf/area), m².
          var R = 6378137, r = Math.PI / 180, s = 0;
          for (var i = 0; i < ring.length; i++) {
            var p1 = ring[i], p2 = ring[(i + 1) % ring.length], p3 = ring[(i + 2) % ring.length];
            s += (p3[0] * r - p1[0] * r) * Math.sin(p2[1] * r);
          }
          return Math.abs((s * R * R) / 2);
        }
        function fmtLen(m) { return m >= 1000 ? (m / 1000).toLocaleString("it-IT", { maximumFractionDigits: 2 }) + " km" : Math.round(m).toLocaleString("it-IT") + " m"; }
        function fmtArea(a) { return a >= 1e6 ? (a / 1e6).toLocaleString("it-IT", { maximumFractionDigits: 2 }) + " km²" : Math.round(a).toLocaleString("it-IT") + " m²"; }
        function measureData() {
          var f = [];
          var closed = finished && pts.length >= 3;
          if (closed) f.push({ type: "Feature", geometry: { type: "Polygon", coordinates: [pts.concat([pts[0]])] }, properties: {} });
          if (pts.length >= 2) f.push({ type: "Feature", geometry: { type: "LineString", coordinates: closed ? pts.concat([pts[0]]) : pts }, properties: {} });
          pts.forEach(function (p) { f.push({ type: "Feature", geometry: { type: "Point", coordinates: p }, properties: {} }); });
          return { type: "FeatureCollection", features: f };
        }
        function ensureMeasureLayers() {
          if (!map || !map.getStyle()) return;
          if (!map.getSource("rd-measure")) {
            map.addSource("rd-measure", { type: "geojson", data: measureData() });
            map.addLayer({ id: "rd-measure-fill", type: "fill", source: "rd-measure", filter: ["==", ["geometry-type"], "Polygon"], paint: { "fill-color": "#2563eb", "fill-opacity": 0.12 } });
            map.addLayer({ id: "rd-measure-line", type: "line", source: "rd-measure", filter: ["==", ["geometry-type"], "LineString"], paint: { "line-color": "#2563eb", "line-width": 2.5, "line-dasharray": [2, 1.5] } });
            map.addLayer({ id: "rd-measure-pts", type: "circle", source: "rd-measure", filter: ["==", ["geometry-type"], "Point"], paint: { "circle-radius": 4.5, "circle-color": "#ffffff", "circle-stroke-color": "#2563eb", "circle-stroke-width": 2 } });
          } else {
            ["rd-measure-fill", "rd-measure-line", "rd-measure-pts"].forEach(function (id) { if (map.getLayer(id)) map.moveLayer(id); });
          }
        }
        function updateMeasure() {
          var len = 0;
          for (var i = 1; i < pts.length; i++) len += haversine(pts[i - 1], pts[i]);
          var out = pts.length < 2 ? "Clicca sulla mappa per aggiungere punti, doppio clic per chiudere l'area." : "Distanza: " + fmtLen(len);
          if (finished && pts.length >= 3) out += " · Perimetro: " + fmtLen(len + haversine(pts[pts.length - 1], pts[0])) + " · Area: " + fmtArea(ringArea(pts));
          $("measure-out").textContent = out;
          var src = map && map.getSource("rd-measure");
          if (src) src.setData(measureData());
        }
        function setMeasure(on) {
          measuring = on;
          if (on) stopPick();
          $("measure-box").hidden = !on;
          $("map").classList.toggle("measuring", on);
          if (measureBtn) measureBtn.classList.toggle("ctrl-active", on);
          if (map) { if (on) map.doubleClickZoom.disable(); else map.doubleClickZoom.enable(); }
          if (!on) { pts = []; finished = false; }
          updateMeasure();
        }
        function stopMeasure() { if (measuring) setMeasure(false); }
        $("measure-undo").addEventListener("click", function () { pts.pop(); finished = false; updateMeasure(); });
        $("measure-clear").addEventListener("click", function () { pts = []; finished = false; updateMeasure(); });
        $("measure-close").addEventListener("click", stopMeasure);

        // ------------------------------------------------------------------ export image
        function exportPng() {
          if (!map) return;
          map.once("render", function () {
            map.getCanvas().toBlob(function (blob) {
              if (!blob) return showNotice("Esportazione non riuscita.");
              var a = el("a", { href: URL.createObjectURL(blob), download: "redeep-mappa-" + new Date().toISOString().slice(0, 10) + ".png" });
              document.body.appendChild(a);
              a.click();
              setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
            }, "image/png");
          });
          map.triggerRepaint();
        }

        // ------------------------------------------------------------------ search: layers or coordinates
        $("goto").addEventListener("submit", function (e) {
          e.preventDefault();
          var msg = $("goto-msg");
          var v = $("goto-input").value.trim();
          var m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec(v);
          if (m) {
            var lat = parseFloat(m[1].replace(",", ".")), lon = parseFloat(m[2].replace(",", "."));
            if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { msg.textContent = "Coordinate fuori scala."; return; }
            msg.textContent = "";
            if (map) map.flyTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 13) });
            return;
          }
          var q = v.toLowerCase();
          var s = STYLES.filter(function (x) { return q && x.label.toLowerCase().indexOf(q) >= 0; })[0];
          var g = GROUPS.filter(function (x) { return q && (x.label.toLowerCase().indexOf(q) >= 0 || x.note.toLowerCase().indexOf(q) >= 0); })[0];
          if (s) { selectStyle(s.id); msg.textContent = "Sfondo: " + s.label; return; }
          if (g && layersOf(g.id).length) { addComp(g.id); msg.textContent = "«" + g.label + "» nei layer."; return; }
          msg.textContent = "Scrivi il nome di un layer (es. edifici) o latitudine e longitudine (es. 45.07, 7.68).";
        });

        // ------------------------------------------------------------------ status bar
        function updateView() {
          var b = map.getBounds();
          $("st-zoom").textContent = map.getZoom().toFixed(2);
          $("st-bearing").textContent = map.getBearing().toFixed(1) + "°";
          $("st-pitch").textContent = map.getPitch().toFixed(1) + "°";
          $("st-bbox").textContent = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(function (n) { return n.toFixed(4); }).join(", ");
        }

        // ------------------------------------------------------------------ map
        loadStyle(styleId)
          .then(function (style) {
            styleJson = JSON.parse(JSON.stringify(style));
            renderLayers();
            renderTree();
            map = new maplibregl.Map({
              container: "map",
              style: withProjection(style),
              center: [12.5, 42.5],
              zoom: 4.5,
              maxZoom: 19,
              attributionControl: { compact: true },
            });
            map.addControl(new maplibregl.FullscreenControl(), "top-right");
            map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
            map.addControl(buttonControl("globe", "Vista globo / piana", function () { setGlobe(!globe); renderLayers(); }, function (b) { globeBtn = b; setGlobe(globe, false); }), "top-right");
            map.addControl(buttonControl("layers", "Cambia sfondo", openBasemaps), "top-right");
            map.addControl(buttonControl("pick", "Informazioni: clicca un oggetto", function () { setPick(!picking); }, function (b) { pickBtn = b; }), "top-right");
            map.addControl(buttonControl("ruler", "Misura distanze e aree", function () { setMeasure(!measuring); }, function (b) { measureBtn = b; }), "top-right");
            map.addControl(buttonControl("camera", "Esporta immagine (PNG)", exportPng), "top-right");
            map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: false } }), "top-right");
            map.addControl(new maplibregl.ScaleControl(), "bottom-left");
            map.on("style.load", applyState);
            map.on("load", updateView);
            map.on("moveend", updateView);
            map.on("mousemove", function (e) { $("st-coords").textContent = e.lngLat.lat.toFixed(5) + ", " + e.lngLat.lng.toFixed(5); });
            map.on("mouseout", function () { $("st-coords").textContent = "—"; });
            map.on("click", function (e) {
              if (measuring) {
                if (finished) { pts = []; finished = false; }
                pts.push([e.lngLat.lng, e.lngLat.lat]);
                updateMeasure();
              } else if (picking) identify(e);
            });
            map.on("dblclick", function (e) {
              if (!measuring) return;
              e.preventDefault();
              // A double click also fires two clicks: drop the duplicate point.
              if (pts.length >= 2 && haversine(pts[pts.length - 1], pts[pts.length - 2]) < 1) pts.pop();
              finished = true;
              updateMeasure();
            });
            map.on("error", function (event) {
              if (failed) return;
              var message = (event && event.error && event.error.message) || "";
              if (/pmtiles|planet|Failed to fetch|NetworkError|40[34]/i.test(message)) {
                failed = true;
                showNotice("Tile della mappa non raggiungibili al momento.", true);
              }
            });
          })
          .catch(function (error) {
            showNotice(error.message || "Impossibile avviare la mappa.", true);
          });
      })();
    </script>
  </body>
</html>
