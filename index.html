<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Redeep</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
      :root {
        --bg: #ffffff;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --hover: #f3f4f6;
        --accent: #2563eb;
        --accent-soft: #eff6ff;
        --rail: 44px;
        --panel-w: 300px;
        --status-h: 26px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }

      button { font: inherit; color: inherit; }

      .app {
        position: fixed;
        inset: 0 0 var(--status-h) 0;
        display: flex;
      }

      /* Left icon rail */
      .rail {
        flex: 0 0 var(--rail);
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 8px;
        z-index: 3;
      }

      .rail button {
        width: 34px;
        border: 0;
        background: transparent;
        border-radius: 8px;
        padding: 8px 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }

      .rail button[aria-pressed="true"] { background: var(--hover); color: var(--text); }
      .rail button:hover { color: var(--text); }
      .rail .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

      /* Layer panel */
      .panel {
        flex: 0 0 var(--panel-w);
        width: var(--panel-w);
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        z-index: 3;
      }

      .panel[hidden] { display: none; }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 10px 10px 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }

      .icon-btn {
        border: 0;
        background: transparent;
        border-radius: 6px;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text);
      }

      .icon-btn:hover { background: var(--hover); }
      svg[hidden] { display: none; }
      .icon-btn:focus-visible, .rail button:focus-visible, .basemap-grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .panel-body { flex: 1; overflow: auto; padding: 12px 10px; }
      .panel-body .hint { color: var(--muted); font-size: 13px; margin: 2px 4px 12px; line-height: 1.45; }

      .layer-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 10px 8px;
      }

      .layer-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

      .layer-row { display: flex; align-items: center; gap: 6px; }
      .layer-row .grip { color: #c0c4cc; font-size: 12px; letter-spacing: -2px; cursor: default; user-select: none; }
      .layer-row .name { flex: 1; font-weight: 600; cursor: pointer; border: 0; background: none; text-align: left; padding: 2px 0; display: flex; align-items: center; gap: 6px; }
      .layer-row .kind { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

      .opacity { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--muted); }
      .opacity input { flex: 1; accent-color: var(--accent); }
      .opacity output { font-family: ui-monospace, Menlo, Consolas, monospace; min-width: 30px; text-align: right; }

      .menu {
        position: absolute;
        z-index: 20;
        min-width: 210px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
        padding: 4px;
      }

      .menu[hidden] { display: none; }
      .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
      .menu button:hover { background: var(--hover); }

      .panel-foot { border-top: 1px solid var(--line); padding: 10px; }

      .search { position: relative; }
      .search input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px 8px 32px;
        font: inherit;
        font-size: 13px;
      }
      .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
      .search-msg { font-size: 12px; color: var(--muted); margin: 6px 2px 0; min-height: 1em; }

      /* Map */
      .map-wrap { position: relative; flex: 1; min-width: 0; }
      #map {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1px 1px at 12% 22%, #fff9 50%, transparent 51%),
          radial-gradient(1px 1px at 68% 14%, #fff8 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 38% 74%, #fffa 50%, transparent 51%),
          radial-gradient(1px 1px at 84% 62%, #fff7 50%, transparent 51%),
          radial-gradient(1px 1px at 22% 88%, #fff8 50%, transparent 51%),
          radial-gradient(1px 1px at 56% 42%, #fff6 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 92% 30%, #fff9 50%, transparent 51%),
          radial-gradient(ellipse at center, #0b1a33 0%, #050b18 70%);
        background-size: 230px 230px, 310px 310px, 270px 270px, 190px 190px, 350px 350px, 160px 160px, 400px 400px, 100% 100%;
      }
      #map.hidden-basemap .maplibregl-canvas { visibility: hidden; }
      #map.flat { background: #f3f4f6; }

      .maplibregl-ctrl-group button.ctrl-active .ctrl-ico { color: var(--accent); }
      .ctrl-ico { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: #333; }

      /* Status bar */
      .status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--status-h);
        border-top: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 12px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11.5px;
        color: #374151;
        white-space: nowrap;
        overflow: hidden;
      }

      /* Basemap dialog */
      dialog.basemaps {
        border: 0;
        border-radius: 12px;
        padding: 22px 24px 24px;
        width: min(560px, calc(100vw - 32px));
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      dialog.basemaps::backdrop { background: rgba(0, 0, 0, 0.45); }
      dialog.basemaps h3 { margin: 0 0 4px; font-size: 18px; }
      dialog.basemaps p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
      dialog.basemaps .close { position: absolute; top: 14px; right: 14px; }
      .basemap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .basemap-grid button {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 0 0 10px;
        cursor: pointer;
        overflow: hidden;
        font-weight: 600;
        text-align: center;
      }
      .basemap-grid button:hover { border-color: #9ca3af; }
      .basemap-grid button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
      .basemap-grid .swatch { display: block; height: 54px; margin-bottom: 8px; }
      .basemap-grid small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 2px; padding: 0 6px; }

      .notice {
        position: fixed;
        left: 50%;
        bottom: 44px;
        transform: translateX(-50%);
        z-index: 30;
        max-width: calc(100% - 32px);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        color: #fff;
        background: rgba(153, 27, 27, 0.92);
      }
      .notice[hidden] { display: none; }

      /* Phones: the panel floats over the map. */
      @media (max-width: 720px) {
        :root { --panel-w: min(300px, calc(100vw - var(--rail) - 16px)); }
        .panel { position: absolute; left: var(--rail); top: 0; bottom: 0; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.15); }
        .status .wide { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <nav class="rail" aria-label="Pannelli">
        <button type="button" id="rail-layers" aria-pressed="true" aria-controls="panel" title="Layer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>
          <span class="vlabel">Layer</span>
        </button>
      </nav>

      <aside class="panel" id="panel" aria-label="Layer">
        <div class="panel-head">
          <h2>Layer</h2>
          <button type="button" class="icon-btn" id="open-basemaps" title="Cambia sfondo" aria-label="Cambia sfondo">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
          </button>
          <button type="button" class="icon-btn" id="close-panel" title="Chiudi pannello" aria-label="Chiudi pannello">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/></svg>
          </button>
        </div>
        <div class="panel-body">
          <p class="hint">Mappe di base Redeep. Clicca su «Sfondo» per scegliere la mappa.</p>
          <div class="layer-card" id="basemap-card">
            <div class="layer-row">
              <span class="grip" aria-hidden="true">⋮⋮</span>
              <button type="button" class="icon-btn" id="basemap-eye" aria-pressed="true" title="Nascondi sfondo" aria-label="Nascondi sfondo">
                <svg id="eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
              <button type="button" class="name" id="basemap-name" title="Cambia sfondo">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>
                <span>Sfondo</span>
              </button>
              <span class="kind" id="basemap-kind">Dark</span>
              <button type="button" class="icon-btn" id="basemap-more" title="Altre azioni" aria-label="Altre azioni" aria-haspopup="menu">⋯</button>
            </div>
            <div class="opacity">
              <label for="basemap-opacity">Opacità</label>
              <input type="range" id="basemap-opacity" min="0" max="1" step="0.05" value="1" />
              <output id="basemap-opacity-out" for="basemap-opacity">1.00</output>
            </div>
          </div>
          <div class="menu" id="basemap-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-cmd="change">Cambia sfondo…</button>
            <button type="button" role="menuitem" data-cmd="globe">Vista globo</button>
            <button type="button" role="menuitem" data-cmd="world">Zoom sul mondo</button>
            <button type="button" role="menuitem" data-cmd="italy">Zoom sull'Italia</button>
            <button type="button" role="menuitem" data-cmd="reset">Ripristina opacità e visibilità</button>
          </div>
        </div>
        <div class="panel-foot">
          <form class="search" id="goto" autocomplete="off">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="goto-input" placeholder="Vai a coordinate: 45.07, 7.68" aria-label="Vai a coordinate (latitudine, longitudine)" />
          </form>
          <p class="search-msg" id="goto-msg" role="status"></p>
        </div>
      </aside>

      <div class="map-wrap">
        <div id="map" role="region" aria-label="Mappa"></div>
      </div>
    </div>

    <div class="status" aria-live="off">
      <span>Coords: <span id="st-coords">—</span></span>
      <span>Zoom: <span id="st-zoom">—</span></span>
      <span class="wide">Bearing: <span id="st-bearing">0.0°</span></span>
      <span class="wide">Pitch: <span id="st-pitch">0.0°</span></span>
      <span class="wide">BBox: <span id="st-bbox">—</span></span>
    </div>

    <dialog class="basemaps" id="basemaps" aria-labelledby="basemaps-title">
      <button type="button" class="icon-btn close" id="basemaps-close" aria-label="Chiudi">✕</button>
      <h3 id="basemaps-title">Cambia sfondo</h3>
      <p>Mappe di base Redeep: OpenStreetMap servito dai nostri server, in cinque stili.</p>
      <div class="basemap-grid" id="basemap-grid"></div>
    </dialog>

    <p class="notice" id="notice" role="status" hidden></p>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
    <script>
      (function () {
        // Basemap assets on DigitalOcean Spaces (CDN): planet.pmtiles, fonts/, sprites/, natural_earth/
        var TILES_BASE = "https://redeep-tiles.ams3.cdn.digitaloceanspaces.com";
        var ATTRIBUTION =
          '<a href="https://openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> ' +
          '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap contributors</a>';
        var STYLES = [
          { id: "dark", label: "Dark", note: "scuro, per i dati", swatch: "linear-gradient(135deg,#0e0e0e,#2b2b2b 60%,#3d3d3d)" },
          { id: "positron", label: "Positron", note: "chiaro e neutro", swatch: "linear-gradient(135deg,#f2f3f0,#dcdcdc 60%,#c6d6e0)" },
          { id: "liberty", label: "Liberty", note: "classico, con edifici", swatch: "linear-gradient(135deg,#f8f4f0,#e3dccb 45%,#a0c8f0 80%)" },
          { id: "bright", label: "Bright", note: "colori vivaci", swatch: "linear-gradient(135deg,#f8f4f0,#fdd27d 50%,#8fd38f)" },
          { id: "fiord", label: "Fiord", note: "blu notte", swatch: "linear-gradient(135deg,#45516e,#38435c 55%,#2c354a)" },
        ];
        var ITALY = [[6.5, 36.4], [18.6, 47.2]];

        var $ = function (id) { return document.getElementById(id); };
        var notice = $("notice");
        function showNotice(message) { notice.textContent = message; notice.hidden = false; }

        if (!window.maplibregl || !window.pmtiles) {
          showNotice("Impossibile caricare la mappa. Ricarica la pagina.");
          return;
        }

        // Per-viewer preferences (style, panel, globe). Storage can be unavailable: defaults then.
        function load(key, fallback) { try { var v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; } }
        function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

        var protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        var styleCache = {};
        function loadStyle(id) {
          if (styleCache[id]) return Promise.resolve(JSON.parse(JSON.stringify(styleCache[id])));
          return fetch("./styles/" + id + ".json")
            .then(function (response) {
              if (!response.ok) throw new Error("Stile non trovato: " + id);
              return response.json();
            })
            .then(function (style) {
              // OpenFreeMap styles ship with __TILEJSON_DOMAIN__ placeholders: point them at our bucket.
              style.sources.openmaptiles = { type: "vector", url: "pmtiles://" + TILES_BASE + "/planet.pmtiles", attribution: ATTRIBUTION };
              if (style.sources.ne2_shaded) style.sources.ne2_shaded.tiles = [TILES_BASE + "/natural_earth/ne2sr/{z}/{x}/{y}.png"];
              style.sprite = TILES_BASE + "/sprites/ofm_f384/ofm";
              style.glyphs = TILES_BASE + "/fonts/{fontstack}/{range}.pbf";
              styleCache[id] = style;
              return JSON.parse(JSON.stringify(style));
            });
        }

        var current = load("redeep-map-style", "dark");
        if (!STYLES.some(function (s) { return s.id === current; })) current = "dark";
        var globe = load("redeep-map-globe", "0") === "1";
        var map;
        var failed = false;

        function withProjection(style) {
          style.projection = { type: globe ? "globe" : "mercator" };
          // Atmosphere around the globe; outside it the starry background of #map shows through.
          style.sky = { "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0] };
          return style;
        }

        // ---------------------------------------------------------------- panel
        var panel = $("panel");
        var railLayers = $("rail-layers");
        function setPanel(open) {
          panel.hidden = !open;
          railLayers.setAttribute("aria-pressed", String(open));
          save("redeep-map-panel", open ? "1" : "0");
          if (map) setTimeout(function () { map.resize(); }, 0);
        }
        setPanel(load("redeep-map-panel", window.innerWidth > 720 ? "1" : "0") === "1");
        railLayers.addEventListener("click", function () { setPanel(panel.hidden); });
        $("close-panel").addEventListener("click", function () { setPanel(false); });

        // ---------------------------------------------------------------- basemap layer card
        var card = $("basemap-card");
        var kind = $("basemap-kind");
        var eye = $("basemap-eye");
        var opacity = $("basemap-opacity");
        var opacityOut = $("basemap-opacity-out");
        var mapEl = $("map");
        var visible = true;

        function labelOf(id) { return STYLES.filter(function (s) { return s.id === id; })[0].label; }
        kind.textContent = labelOf(current);

        function setVisible(v) {
          visible = v;
          mapEl.classList.toggle("hidden-basemap", !v);
          eye.setAttribute("aria-pressed", String(v));
          eye.title = v ? "Nascondi sfondo" : "Mostra sfondo";
          eye.setAttribute("aria-label", eye.title);
          $("eye-on").hidden = !v;
          $("eye-off").hidden = v;
        }
        function setOpacity(v) {
          opacity.value = String(v);
          opacityOut.value = Number(v).toFixed(2);
          var canvas = mapEl.querySelector(".maplibregl-canvas");
          if (canvas) canvas.style.opacity = String(v);
        }
        eye.addEventListener("click", function () { setVisible(!visible); });
        opacity.addEventListener("input", function () { setOpacity(opacity.value); });
        card.addEventListener("click", function () { card.classList.add("selected"); });
        document.addEventListener("click", function (e) { if (!card.contains(e.target)) card.classList.remove("selected"); });

        // ⋯ menu
        var menu = $("basemap-menu");
        var more = $("basemap-more");
        function closeMenu() { menu.hidden = true; more.setAttribute("aria-expanded", "false"); }
        more.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!menu.hidden) return closeMenu();
          var r = more.getBoundingClientRect();
          var p = panel.getBoundingClientRect();
          menu.style.top = r.bottom - p.top + 4 + "px";
          menu.style.left = Math.max(8, r.right - p.left - 210) + "px";
          menu.querySelector('[data-cmd="globe"]').textContent = globe ? "Vista piana" : "Vista globo";
          menu.hidden = false;
          more.setAttribute("aria-expanded", "true");
          menu.querySelector("button").focus();
        });
        document.addEventListener("click", function (e) { if (!menu.contains(e.target)) closeMenu(); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
        menu.addEventListener("click", function (e) {
          var cmd = e.target.dataset && e.target.dataset.cmd;
          if (!cmd) return;
          closeMenu();
          if (cmd === "change") openBasemaps();
          if (cmd === "globe") setGlobe(!globe);
          if (cmd === "world" && map) map.flyTo({ center: [12.5, 30], zoom: 1.6, bearing: 0, pitch: 0 });
          if (cmd === "italy" && map) map.fitBounds(ITALY, { padding: 30 });
          if (cmd === "reset") { setVisible(true); setOpacity(1); }
        });

        // ---------------------------------------------------------------- basemap dialog
        var dialog = $("basemaps");
        var grid = $("basemap-grid");
        STYLES.forEach(function (s) {
          var b = document.createElement("button");
          b.type = "button";
          b.dataset.id = s.id;
          var sw = document.createElement("span");
          sw.className = "swatch";
          sw.style.background = s.swatch;
          var note = document.createElement("small");
          note.textContent = s.note;
          b.appendChild(sw);
          b.appendChild(document.createTextNode(s.label));
          b.appendChild(note);
          b.addEventListener("click", function () { selectStyle(s.id); dialog.close(); });
          grid.appendChild(b);
        });
        function markCurrent() {
          Array.prototype.forEach.call(grid.children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === current)); });
        }
        function openBasemaps() {
          markCurrent();
          if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
          var sel = grid.querySelector('[aria-pressed="true"]');
          if (sel) sel.focus();
        }
        $("basemaps-close").addEventListener("click", function () { dialog.close(); });
        dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });
        $("basemap-name").addEventListener("click", openBasemaps);
        $("open-basemaps").addEventListener("click", openBasemaps);

        function selectStyle(id) {
          if (id === current && map) return;
          current = id;
          save("redeep-map-style", id);
          kind.textContent = labelOf(id);
          setVisible(true);
          loadStyle(id)
            .then(function (style) { map.setStyle(withProjection(style)); })
            .catch(function (error) { showNotice(error.message); });
        }

        // ---------------------------------------------------------------- globe
        var globeBtn = null;
        function setGlobe(on, apply) {
          globe = on;
          save("redeep-map-globe", on ? "1" : "0");
          mapEl.classList.toggle("flat", !on);
          if (globeBtn) {
            globeBtn.classList.toggle("ctrl-active", on);
            globeBtn.title = on ? "Vista piana" : "Vista globo";
          }
          if (map && apply !== false) map.setProjection({ type: on ? "globe" : "mercator" });
        }
        mapEl.classList.toggle("flat", !globe);

        function GlobeControl() {}
        GlobeControl.prototype.onAdd = function () {
          var box = document.createElement("div");
          box.className = "maplibregl-ctrl maplibregl-ctrl-group";
          globeBtn = document.createElement("button");
          globeBtn.type = "button";
          globeBtn.setAttribute("aria-label", "Vista globo / piana");
          globeBtn.innerHTML = '<span class="ctrl-ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>';
          globeBtn.addEventListener("click", function () { setGlobe(!globe); });
          box.appendChild(globeBtn);
          setGlobe(globe, false);
          return box;
        };
        GlobeControl.prototype.onRemove = function () {};

        function BasemapControl() {}
        BasemapControl.prototype.onAdd = function () {
          var box = document.createElement("div");
          box.className = "maplibregl-ctrl maplibregl-ctrl-group";
          var b = document.createElement("button");
          b.type = "button";
          b.title = "Cambia sfondo";
          b.setAttribute("aria-label", "Cambia sfondo");
          b.innerHTML = '<span class="ctrl-ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg></span>';
          b.addEventListener("click", openBasemaps);
          box.appendChild(b);
          return box;
        };
        BasemapControl.prototype.onRemove = function () {};

        // ---------------------------------------------------------------- go to coordinates
        $("goto").addEventListener("submit", function (e) {
          e.preventDefault();
          var msg = $("goto-msg");
          var m = /^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/.exec($("goto-input").value);
          if (!m) { msg.textContent = "Scrivi latitudine e longitudine, es. 45.07, 7.68"; return; }
          var lat = parseFloat(m[1].replace(",", "."));
          var lon = parseFloat(m[2].replace(",", "."));
          if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { msg.textContent = "Coordinate fuori scala."; return; }
          msg.textContent = "";
          if (map) map.flyTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 13) });
        });

        // ---------------------------------------------------------------- status bar
        var stCoords = $("st-coords"), stZoom = $("st-zoom"), stBearing = $("st-bearing"), stPitch = $("st-pitch"), stBbox = $("st-bbox");
        function updateView() {
          var b = map.getBounds();
          stZoom.textContent = map.getZoom().toFixed(2);
          stBearing.textContent = map.getBearing().toFixed(1) + "°";
          stPitch.textContent = map.getPitch().toFixed(1) + "°";
          stBbox.textContent = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(function (n) { return n.toFixed(4); }).join(", ");
        }

        // ---------------------------------------------------------------- map
        loadStyle(current)
          .then(function (style) {
            map = new maplibregl.Map({
              container: "map",
              style: withProjection(style),
              center: [12.5, 42.5],
              zoom: 4.5,
              maxZoom: 19,
              attributionControl: { compact: true },
            });
            map.addControl(new maplibregl.FullscreenControl(), "top-right");
            map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
            map.addControl(new GlobeControl(), "top-right");
            map.addControl(new BasemapControl(), "top-right");
            map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: false } }), "top-right");
            map.addControl(new maplibregl.ScaleControl(), "bottom-left");
            map.on("load", function () { setOpacity(opacity.value); updateView(); });
            map.on("styledata", function () { setOpacity(opacity.value); });
            map.on("moveend", updateView);
            map.on("mousemove", function (e) { stCoords.textContent = e.lngLat.lat.toFixed(5) + ", " + e.lngLat.lng.toFixed(5); });
            map.on("mouseout", function () { stCoords.textContent = "—"; });
            map.on("error", function (event) {
              if (failed) return;
              var message = (event && event.error && event.error.message) || "";
              if (/pmtiles|planet|Failed to fetch|NetworkError|40[34]/i.test(message)) {
                failed = true;
                showNotice("Tile della mappa non raggiungibili al momento.");
              }
            });
          })
          .catch(function (error) {
            showNotice(error.message || "Impossibile avviare la mappa.");
          });
      })();
    </script>
  </body>
</html>
